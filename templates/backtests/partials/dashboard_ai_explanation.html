{% if explanation_points %}
<section class="ai-explanation" aria-labelledby="ai-explanation-title">
  <h4 id="ai-explanation-title">AI explanation</h4>
  <ul class="ai-explanation-list">
    {% for point in explanation_points %}<li>{{ point }}</li>{% endfor %}
  </ul>
  <p class="ai-explanation-disclaimer">{{ disclaimer }}</p>
</section>
{% else %}
<p class="ai-explanation-error" role="alert">{{ error }}</p>
{% endif %}
