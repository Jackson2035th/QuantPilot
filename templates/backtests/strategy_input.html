{% extends "base.html" %}
{% block title %}New Strategy | QuantPilot{% endblock %}
{% block content %}
<h1>New Strategy</h1>
<p class="lede">Describe a US stock backtest. QuantPilot will parse it into confirmed parameters before it runs anything.</p>
<form hx-post="{% url 'parse_strategy' %}" hx-target="#parse-result" hx-swap="innerHTML" method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Parse Strategy</button>
</form>
<section id="parse-result"></section>
{% endblock %}
