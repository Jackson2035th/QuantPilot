<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuantPilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  {% if user.is_authenticated %}
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="brand" href="{% url 'dashboard' %}">QuantPilot</a>
      <nav class="sidebar-nav" aria-label="Primary navigation">
        <a class="{% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="{% if request.resolver_match.url_name == 'strategy_input' %}is-active{% endif %}" href="{% url 'strategy_input' %}">New Strategy</a>
        <a class="{% if request.resolver_match.url_name == 'history' %}is-active{% endif %}" href="{% url 'history' %}">History</a>
        <a class="{% if request.resolver_match.url_name == 'guide' %}is-active{% endif %}" href="{% url 'guide' %}">Guide</a>
      </nav>
      <p class="sidebar-note">Historical backtesting only. Not financial advice.</p>
    </aside>
    <div class="app-content">
      <header class="app-topbar">
        <span class="data-source">Data source: yfinance</span>
        <nav aria-label="Account navigation">
          <form class="logout-form" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="logout-button" type="submit">Log out</button>
          </form>
        </nav>
      </header>
  {% else %}
  <header class="auth-topbar"><a class="brand" href="{% url 'login' %}">QuantPilot</a></header>
  {% endif %}
  <main class="{% if user.is_authenticated %}app-main{% else %}auth-main{% endif %}">{% block content %}{% endblock %}</main>
  {% if user.is_authenticated %}
    </div>
  </div>
  {% endif %}
</body>
</html>
